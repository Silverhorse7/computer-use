[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use"
version = "0.1.0"
description = "High-Performance Hybrid Computer Use & Browser Automation Engine (DOM Injection + In-Memory Batched Perception + Native Win32 STA Control)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Yosef Madboly", email = "yosefone212@gmail.com" }
]
keywords = [
    "computer-use",
    "automation",
    "rpa",
    "browser-automation",
    "win32",
    "devtools",
    "dom-injection",
    "ai-agent",
    "fast-automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pillow>=9.0.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306; platform_system == 'Windows'",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
computer-use = "computer_use.cli:main"

[project.urls]
Homepage = "https://github.com/Silverhorse7/computer-use"
Repository = "https://github.com/Silverhorse7/computer-use.git"
Issues = "https://github.com/Silverhorse7/computer-use/issues"
